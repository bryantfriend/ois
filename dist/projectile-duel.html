<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projectile Duel | Oxford Physics</title><link rel="icon" href="./assets/oxford-logo.png"><link rel="stylesheet" href="./projectile-duel.css"></head><body><div id="smartboard">
<nav class="toolbar" aria-label="Game controls"><a href="./?subject=physics">← Physics games</a><button onclick="restartGame()">Restart scores</button><button id="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button></nav>
<p class="instructions">Aim with angle and power, then fire. Hit the other cannon to score! Each cannon reloads for 5 seconds. New terrain follows every hit.</p>
        <!-- ================= GAME VIEW ================= -->
        <div id="game-view" class="view active">
            <div id="game-header">
                <div class="score-box p1-score-box">Blue: <span id="p1-score">0</span></div>
                <strong>Projectile Duel</strong>
                <div class="score-box p2-score-box">Red: <span id="p2-score">0</span></div>
            </div>

            <!-- Main Battle Area -->
            <div id="game-area">
                <svg id="game-svg" viewBox="0 0 1000 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two cannons facing across a mountain">
                    
                    <!-- Ground -->
                    <rect x="0" y="450" width="1000" height="50" fill="#22c55e" />
                    
                    <!-- The Mountain Barrier -->
                    <polygon id="mountain-polygon" points="350,450 500,200 650,450" fill="#475569" stroke="#334155" stroke-width="5"/>

                    <!-- Platforms for varying elevations -->
                    <rect id="p1-platform" x="60" y="420" width="80" height="30" fill="#64748b" stroke="#334155" stroke-width="3" />
                    <rect id="p2-platform" x="860" y="420" width="80" height="30" fill="#64748b" stroke="#334155" stroke-width="3" />

                    <!-- Projectile Trajectory Previews -->
                    <path id="p1-preview" d="" fill="none" stroke="rgba(59, 130, 246, 0.4)" stroke-width="4" stroke-dasharray="10,10" />
                    <path id="p2-preview" d="" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="4" stroke-dasharray="10,10" />

                    <!-- Player 1 Cannon (Blue) -->
                    <g id="p1-cannon-group" transform="translate(100, 420)">
                        <!-- Health/Hitbox -->
                        <rect x="-30" y="-30" width="60" height="60" fill="transparent" />
                        <!-- Barrel -->
                        <rect id="p1-barrel" x="0" y="-12" width="70" height="24" fill="#1e3a8a" rx="5" />
                        <!-- Base -->
                        <path d="M -30 30 L 30 30 L 20 -10 L -20 -10 Z" fill="#3b82f6" />
                        <circle cx="0" cy="10" r="20" fill="#0f172a" />
                        <circle cx="0" cy="10" r="8" fill="#94a3b8" />
                    </g>

                    <!-- Player 2 Cannon (Red) -->
                    <g id="p2-cannon-group" transform="translate(900, 420)">
                        <!-- Barrel (Rotates from right side) -->
                        <rect id="p2-barrel" x="-70" y="-12" width="70" height="24" fill="#7f1d1d" rx="5" />
                        <!-- Base -->
                        <path d="M -30 30 L 30 30 L 20 -10 L -20 -10 Z" fill="#ef4444" />
                        <circle cx="0" cy="10" r="20" fill="#0f172a" />
                        <circle cx="0" cy="10" r="8" fill="#94a3b8" />
                    </g>

                    <!-- Group for active projectiles -->
                    <g id="projectile-layer"></g>

                </svg>
                
                <div id="message-overlay" role="status" aria-live="polite">Direct Hit!</div>
            </div>

            <!-- Dual Controls Area -->
            <div class="dual-controls">
                
                <!-- Player 1 Controls -->
                <div class="player-panel p1-panel">
                    <div class="control-row">
                        <label for="p1-angle">Angle: <span id="p1-angle-val">45</span>°</label>
                        <button class="adj-btn" onclick="adjustInput('p1-angle', -1)">-</button>
                        <input type="range" id="p1-angle" min="0" max="90" value="45" oninput="updatePreviews()">
                        <button class="adj-btn" onclick="adjustInput('p1-angle', 1)">+</button>
                    </div>
                    <div class="control-row">
                        <label for="p1-power">Power: <span id="p1-power-val">60</span></label>
                        <button class="adj-btn" onclick="adjustInput('p1-power', -2)">-</button>
                        <input type="range" id="p1-power" min="20" max="100" value="60" oninput="updatePreviews()">
                        <button class="adj-btn" onclick="adjustInput('p1-power', 2)">+</button>
                    </div>
                    <button class="fire-btn p1-fire" id="p1-fire-btn" onclick="fireCannon(1)">FIRE BLUE 💥</button>
                </div>

                <!-- Player 2 Controls -->
                <div class="player-panel p2-panel">
                    <div class="control-row">
                        <label for="p2-angle">Angle: <span id="p2-angle-val">45</span>°</label>
                        <button class="adj-btn" onclick="adjustInput('p2-angle', -1)">-</button>
                        <input type="range" id="p2-angle" min="0" max="90" value="45" oninput="updatePreviews()">
                        <button class="adj-btn" onclick="adjustInput('p2-angle', 1)">+</button>
                    </div>
                    <div class="control-row">
                        <label for="p2-power">Power: <span id="p2-power-val">60</span></label>
                        <button class="adj-btn" onclick="adjustInput('p2-power', -2)">-</button>
                        <input type="range" id="p2-power" min="20" max="100" value="60" oninput="updatePreviews()">
                        <button class="adj-btn" onclick="adjustInput('p2-power', 2)">+</button>
                    </div>
                    <button class="fire-btn p2-fire" id="p2-fire-btn" onclick="fireCannon(2)">FIRE RED 💥</button>
                </div>

            </div>
        </div>

    </div>

<script src="./projectile-duel.js"></script></body></html>
