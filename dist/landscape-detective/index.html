let saved={};try{saved=JSON.parse(localStorage.getItem('ois.geo.detective.v1')||'{}')||{}}catch{}let scene=0,selected=null,feedback='',locked=false;const $=id=>document.getElementById(id);function found(){return saved[scene]||[]}function save(){try{localStorage.setItem('ois.geo.detective.v1',JSON.stringify(saved))}catch{}}function order(){return Array.from({length:20},(_,i)=>(i*7+scene*3)%items.length)}
function draw(){const names=order(), sky=['#d8edf0','#e3f0df','#f7e6c8','#dbe7f0'][scene%4];$('map').innerHTML=`<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="#fff7e1"/></linearGradient><linearGradient id="land" x2="0" y2="1"><stop stop-color="#c9dfa9"/><stop offset="1" stop-color="#8fbb91"/></linearGradient></defs><rect width="1000" height="650" fill="url(#sky)"/><circle cx="850" cy="80" r="46" fill="#f9d784"/><path d="M0 250Q140 120 300 230T620 210T1000 205V650H0Z" fill="#a6c4a2"/><path d="M0 345Q220 270 420 330T1000 300V650H0Z" fill="url(#land)"/><path d="M0 530Q250 450 470 510T1000 460" stroke="#e2d6a9" stroke-width="55" fill="none" opacity=".7"/><path d="M650 650Q550 550 655 425T580 270" fill="none" stroke="#8dcbd6" stroke-width="38" opacity=".8"/>`+names.map((id,i)=>{let x=110+(i%5)*195,y=145+Math.floor(i/5)*140;return `<g class="spot ${found().includes(id)?'found':''}" role="button" tabindex="0" aria-label="Feature ${i+1}${found().includes(id)?': '+items[id][0]+', identified':''}" data-id="${id}" transform="translate(${x} ${y})"><circle class="halo" r="49" fill="#fffbed" fill-opacity=".92" stroke="#fff" stroke-width="3"/><g class="bob" style="animation-delay:-${i%4}s">${art[items[id][1]]}</g><circle cx="33" cy="-33" r="13" fill="${found().includes(id)?'#499278':'#305c50'}"/><text x="33" y="-28" text-anchor="middle" fill="white" font-size="13" font-weight="700">${found().includes(id)?'✓':i+1}</text></g>`}).join('');$('sceneNo').textContent=`SCENE ${scene+1} / 20`;$('sceneTitle').textContent=scenes[scene][0];$('sceneDesc').textContent=scenes[scene][1]+' Fictional illustration.';$('count').textContent=`${found().length} / 20 features identified`;$('bar').style.width=found().length*5+'%';$('sceneSelect').value=scene;$('prompt').textContent=found().length===20?'Scene complete! Choose another scene.':selected===null?'Choose a feature in the picture.':'What is this feature?';$('feedback').textContent=feedback;if(selected===null){$('choices').innerHTML='';return}let alternatives=[selected,(selected+5+scene)%items.length,(selected+11+scene)%items.length];if(new Set(alternatives).size<3)alternatives=[selected,(selected+1)%items.length,(selected+2)%items.length];alternatives.sort((a,b)=>((a*13+scene*7)%23)-((b*13+scene*7)%23));$('choices').innerHTML=alternatives.map(id=>`<button data-answer="${id}" ${locked?'disabled':''}>${items[id][0]}</button>`).join('')}
$('sceneSelect').innerHTML=scenes.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s[0]}</option>`).join('');function select(id){if(found().includes(id)){feedback=items[id][0]+': '+items[id][2];selected=null}else{selected=id;feedback=''}locked=false;draw()}$('map').addEventListener('click',e=>{const g=e.target.closest('[data-id]');if(g)select(+g.dataset.id)});$('map').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id!==undefined){e.preventDefault();select(+e.target.dataset.id)}});$('choices').addEventListener('click',e=>{if(!e.target.dataset.answer)return;let id=+e.target.dataset.answer;if(id===selected){saved[scene]=[...found(),id];save();feedback='Correct! '+items[id][2];selected=null}else feedback='Not quite. Look closely and try again.';draw()});$('hint').onclick=()=>{feedback=selected===null?'Choose one of the numbered pictures first.':'Hint: '+items[selected][2];draw()};function changeScene(i){scene=i;selected=null;feedback='';draw()}$('sceneSelect').onchange=e=>changeScene(+e.target.value);$('next').onclick=()=>changeScene((scene+1)%20);window.render_game_to_text=()=>JSON.stringify({scene:scene+1,title:scenes[scene][0],found:found().length,selected:selected===null?null:items[selected][0],feedback,features:order().map((id,i)=>({number:i+1,name:items[id][0],found:found().includes(id)}))});window.advanceTime=()=>{};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}});draw();
